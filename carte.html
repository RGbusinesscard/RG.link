<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jean Lou Nivault — Expert-comptable indépendant</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">

<style>
@font-face{
  font-family:'Fraunces';
  src:url('fraunces.woff2') format('woff2');
  font-weight:400 900; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Fraunces';
  src:url('fraunces-italic.woff2') format('woff2');
  font-weight:400 900; font-style:italic; font-display:swap;
}
@font-face{
  font-family:'Work Sans';
  src:url('work-sans.woff2') format('woff2');
  font-weight:100 900; font-style:normal; font-display:swap;
}

:root{
  --paper:#F4F3EF;
  --paper-dim:#ECEAE4;
  --ink:#17181A;
  --charcoal:#26282A;
  --graphite:#5A5D60;
  --mist:#9A9D9F;
  --hair: rgba(23,24,26,0.13);
  --hair-strong: rgba(23,24,26,0.26);
}

*{box-sizing:border-box;}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Work Sans', sans-serif;
  -webkit-font-smoothing:antialiased;
}

.card{
  max-width:430px; margin:0 auto; min-height:100vh; min-height:100dvh;
  background:var(--paper);
  display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,0.06);
}

/* ---------- bandeau photo ---------- */
.banner{
  position:relative; height:184px; overflow:hidden; flex-shrink:0;
}
.banner__img{
  position:absolute; inset:0;
  background-image:url('montagne.jpg');
  background-size:cover; background-position:50% 62%;
  filter:grayscale(1) contrast(1.04);
}
.banner__scrim{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(23,24,26,0.15) 0%, rgba(23,24,26,0.38) 60%, var(--paper) 100%);
}

/* ---------- avatar + identité ---------- */
.identity{ position:relative; padding:0 1.6rem; margin-top:-54px; text-align:center; }
.avatar{
  width:112px; height:112px; border-radius:50%;
  margin:0 auto; background:#fff; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  border:4px solid var(--paper); box-shadow:0 10px 24px rgba(23,24,26,0.25);
}
.avatar__logo{
  width:88%; height:88%;
  background-image:url('logo-ordre.png');
  background-size:contain; background-repeat:no-repeat; background-position:center;
}
.identity__cachet{
  width:30px; margin:.7rem auto 0;
  aspect-ratio:480/257; background-image:url('cachet-ordre.png');
  background-size:contain; background-repeat:no-repeat; background-position:center;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}

.identity__name{
  font-family:'Fraunces', serif; font-weight:600; font-size:1.55rem;
  margin:.8rem 0 .3rem; letter-spacing:-0.01em;
}
.identity__title{
  font-family:'Fraunces', serif; font-style:italic; font-size:1.02rem;
  color:var(--graphite); margin:0 0 .25rem;
}
.identity__loc{
  font-family:'Work Sans', sans-serif; font-size:.78rem; letter-spacing:.05em; text-transform:uppercase;
  color:var(--mist); margin:0;
}

/* ---------- actions ---------- */
.actions{ padding:1.9rem 1.25rem 2.5rem; display:flex; flex-direction:column; gap:.7rem; flex:1; }
.action{
  display:flex; align-items:center; gap:.9rem;
  min-height:62px; padding:0 1.1rem;
  background:#fff; border:1px solid var(--hair); border-radius:14px;
  text-decoration:none; color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.action:active{ transform:scale(.98); background:var(--paper-dim); }
@media (hover:hover){
  .action:hover{ border-color:var(--hair-strong); box-shadow:0 6px 18px rgba(23,24,26,0.06); }
}
.action__icon{
  width:38px; height:38px; border-radius:50%; background:var(--paper-dim);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  color:var(--charcoal);
}
.action__icon svg{ width:18px; height:18px; }
.action__text{ flex:1; min-width:0; }
.action__label{ font-weight:600; font-size:.98rem; display:block; }
.action__sub{ font-size:.76rem; color:var(--mist); display:block; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.action__arrow{ color:var(--mist); flex-shrink:0; font-size:1rem; }

.footer-credit{
  text-align:center; padding:0 1.5rem 2.2rem; margin-top:auto;
  font-size:.72rem; color:var(--mist); letter-spacing:.02em;
}
.footer-credit a{ color:var(--graphite); text-decoration:none; border-bottom:1px solid var(--hair-strong); }

@media (max-width:360px){
  .identity__name{ font-size:1.38rem; }
  .avatar{ width:98px; height:98px; }
}
</style>
</head>
<body>

<div class="card">

  <div class="banner">
    <div class="banner__img"></div>
    <div class="banner__scrim"></div>
  </div>

  <div class="identity">
    <div class="avatar">
      <div class="avatar__logo" role="img" aria-label="Ordre des experts-comptables"></div>
    </div>
    <div class="identity__cachet" role="img" aria-label="Cachet, Ordre des experts-comptables"></div>
    <h1 class="identity__name">Jean Lou Nivault</h1>
    <p class="identity__title">Expert-comptable indépendant</p>
    <p class="identity__loc">Spay · Sarthe</p>
  </div>

  <div class="actions">

    <a class="action" id="saveContact" href="#">
      <span class="action__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      </span>
      <span class="action__text">
        <span class="action__label">Enregistrer le contact</span>
        <span class="action__sub">Ajouter à vos contacts</span>
      </span>
      <span class="action__arrow">›</span>
    </a>

    <a class="action" href="https://www.google.com/maps/search/?api=1&query=1+Rue+des+No%C3%ABs+72700+Spay" target="_blank" rel="noopener">
      <span class="action__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
      <span class="action__text">
        <span class="action__label">Adresse / Itinéraire</span>
        <span class="action__sub">1 Rue des Noës, 72700 Spay</span>
      </span>
      <span class="action__arrow">›</span>
    </a>

    <a class="action" href="https://rgbusinesscard.github.io/JeanLouNivault/" target="_blank" rel="noopener">
      <span class="action__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      </span>
      <span class="action__text">
        <span class="action__label">Site internet</span>
        <span class="action__sub">rgbusinesscard.github.io/JeanLouNivault</span>
      </span>
      <span class="action__arrow">›</span>
    </a>

    <a class="action" href="mailto:jeanlou.nivault.compta@gmail.com">
      <span class="action__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      </span>
      <span class="action__text">
        <span class="action__label">E-mail</span>
        <span class="action__sub">jeanlou.nivault.compta@gmail.com</span>
      </span>
      <span class="action__arrow">›</span>
    </a>

  </div>

  <p class="footer-credit">Carte connectée propulsée par <a href="#" onclick="return false;">RG.card</a></p>

</div>

<script>
  document.getElementById('saveContact').addEventListener('click', function(e){
    e.preventDefault();
    var lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Nivault;Jean Lou;;;',
      'FN:Jean Lou Nivault',
      'ORG:Expert-comptable indépendant',
      'TITLE:Expert-comptable indépendant',
      'ADR;TYPE=WORK:;;1 Rue des Noës;Spay;;72700;France',
      'EMAIL;TYPE=WORK:jeanlou.nivault.compta@gmail.com',
      'URL:https://rgbusinesscard.github.io/JeanLouNivault/',
      'END:VCARD'
    ].join('\r\n');
    var blob = new Blob([lines], {type:'text/vcard;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'Jean-Lou-Nivault.vcf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  });
</script>

</body>
</html>
