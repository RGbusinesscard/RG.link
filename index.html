<title>Jean Lou Nivault — Expert-comptable indépendant</title>

<style>
@font-face{
  font-family:'Fraunces';
  src:url('fraunces.woff2') format('woff2');
  font-weight:400 900; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'Fraunces';
  src:url('fraunces-italic.woff2') format('woff2');
  font-weight:400 900; font-style:italic; font-display:swap;
}
@font-face{
  font-family:'Work Sans';
  src:url('work-sans.woff2') format('woff2');
  font-weight:100 900; font-style:normal; font-display:swap;
}

:root{
  --paper:#F4F3EF;
  --paper-dim:#ECEAE4;
  --ink:#17181A;
  --charcoal:#26282A;
  --graphite:#5A5D60;
  --mist:#9A9D9F;
  --hair: rgba(23,24,26,0.13);
  --hair-strong: rgba(23,24,26,0.26);
}

*{box-sizing:border-box;}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Work Sans', sans-serif;
  -webkit-font-smoothing:antialiased;
}

.card{
  max-width:430px; margin:0 auto; min-height:100vh; min-height:100dvh;
  background:var(--paper);
  display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,0.06);
}

/* ---------- bandeau photo ---------- */
.banner{
  position:relative; height:184px; overflow:hidden; flex-shrink:0;
}
.banner__img{
  position:absolute; inset:0;
  background-image:url('montagne.jpg');
  background-size:cover; background-position:50% 62%;
  filter:grayscale(1) contrast(1.04);
}
.banner__scrim{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(23,24,26,0.15) 0%, rgba(23,24,26,0.38) 60%, var(--paper) 100%);
}

/* ---------- avatar + identité ---------- */
.identity{ position:relative; padding:0 1.6rem; margin-top:-54px; text-align:center; }
.avatar{
  width:112px; height:112px; border-radius:50%;
  margin:0 auto; background:#fff; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  border:4px solid var(--paper); box-shadow:0 10px 24px rgba(23,24,26,0.25);
}
.avatar__logo{
  width:88%; height:88%;
  background-image:url('logo-ordre.png');
  background-size:contain; background-repeat:no-repeat; background-position:center;
}
.identity__cachet{
  width:30px; margin:.7rem auto 0;
  aspect-ratio:480/257; background-image:url('cachet-ordre.png');
  background-size:contain; background-repeat:no-repeat; background-position:center;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}

.identity__name{
  font-family:'Fraunces', serif; font-weight:600; font-size:1.55rem;
  margin:.8rem 0 .3rem; letter-spacing:-0.01em;
}
.identity__title{
  font-family:'Fraunces', serif; font-style:italic; font-size:1.02rem;
  color:var(--graphite); margin:0 0 .25rem;
}
.identity__loc{
  font-family:'Work Sans', sans-serif; font-size:.78rem; letter-spacing:.05em; text-transform:uppercase;
  color:var(--mist); margin:0;
}

/* ---------- actions ---------- */
.actions{ padding:1.9rem 1.25rem 2.5rem; display:flex; flex-direction:column; gap:.7rem; flex:1; }
.action{
  display:flex; align-items:center; gap:.9rem;
  min-height:62px; padding:0 1.1rem;
  background:#fff; border:1px solid var(--hair); border-radius:14px;
  text-decoration:none; color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.action:active{ transform:scale(.98); background:var(--paper-dim); }
@media (hover:hover){
  .action:hover{ border-color:var(--hair-strong); box-shadow:0 6px 18px rgba(23,24,26,0.06); }
}
.action__icon{
  width:38px; height:38px; border-radius:50%; background:var(--paper-dim);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  color:var(--charcoal);
}
.action__icon svg{ width:18px; height:18px; }
.action__text{ flex:1; min-width:0; }
.action__label{ font-weight:600; font-size:.98rem; display:block; }
.action__sub{ font-size:.76rem; color:var(--mist); display:block; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.action__arrow{ color:var(--mist); flex-shrink:0; font-size:1rem; }

.footer-credit{
  text-align:center; padding:0 1.5rem 2.2rem; margin-top:auto;
  font-size:.72rem; color:var(--mist); letter-spacing:.02em;
}
.footer-credit a{ color:var(--graphite); text-decoration:none; border-bottom:1px solid var(--hair-strong); }

@media (max-width:360px){
  .identity__name{ font-size:1.38rem; }
  .avatar{ width:98px; height:98px; }
}
</style>
</head>
